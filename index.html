<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tai Wo MTR Live Tracker</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #e0e0e0; padding: 20px; max-width: 600px; margin: auto; }
        h2 { color: #f39c12; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .card { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .train-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #2a2a2a; }
        .train-row:last-child { border-bottom: none; }
        .meta { font-size: 0.85rem; color: #888; margin-bottom: 15px; }
        .countdown { font-weight: bold; color: #2ecc71; }
        button { background: #e67e22; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-size: 1rem; }
        button:hover { background: #d35400; }
    </style>
</head>
<body>

    <h2>🚆 Tai Wo (EAL) Live Tracker</h2>
    <div class="meta" id="status-time">Loading initial data...</div>
    <button onclick="fetchMTR()">🔄 Refresh Now</button>

    <div id="container" style="margin-top: 20px;"></div>

<script>
async function fetchMTR() {
    const targetUrl = "https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=EAL&sta=TWO";
    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
    
    document.getElementById("status-time").innerText = "Refreshing...";

    try {
        let res = await fetch(proxyUrl);
        let resJson = await res.json();
        let data = JSON.parse(resJson.contents);

        let container = document.getElementById("container");
        container.innerHTML = "";

        if (data.status !== 1) {
            container.innerHTML = `<div class="card">⚠️ API Notice: ${data.message || "No service data."}</div>`;
            return;
        }

        let stationInfo = data.data["TWO-EAL"];
        if (!stationInfo || stationInfo.isServiceStopped === 1) {
            container.innerHTML = `<div class="card">🛑 Service suspended or no data right now.</div>`;
            return;
        }

        let directions = {
            "UP": "Southbound ( towards Admiralty )",
            "DOWN": "Northbound ( towards Lo Wu / Lok Ma Chau )"
        };

        let html = "";
        for (let [dirKey, dirLabel] of Object.entries(directions)) {
            let dirData = stationInfo[dirKey];
            html += `<div class="card"><h3>${dirLabel}</h3>`;
            
            let trainItems = [];
            if (Array.isArray(dirData)) {
                trainItems = dirData;
            } else if (typeof dirData === 'object' && dirData !== null) {
                for (let [pKey, pVal] of Object.entries(dirData)) {
                    if (Array.isArray(pVal)) {
                        pVal.forEach(t => {
                            if (!t.plat) t.plat = pKey;
                            trainItems.push(t);
                        });
                    }
                }
            }

            if (trainItems.length === 0) {
                html += `<div>No upcoming trains listed.</div>`;
            } else {
                trainItems.forEach(train => {
                    let dest = train.dest || "N/A";
                    let plat = train.plat || "-";
                    let ttnt = train.ttnt ? `${train.ttnt} min(s)` : "Arriving";
                    if (train.ttnt === "0") ttnt = "Arriving / Doors Open";

                    html += `
                        <div class="train-row">
                            <span><b>Plat ${plat}</b> ➔ ${dest}</span>
                            <span class="countdown">${ttnt}</span>
                        </div>
                    `;
                });
            }
            html += `</div>`;
        }

        container.innerHTML = html;
        document.getElementById("status-time").innerText = `Last Updated: ${new Date().toLocaleTimeString()}`;

    } catch (err) {
        document.getElementById("container.innerHTML = `<div class='card'>❌ Failed to load data: ${err}</div>`;`
    }
}

// Auto load and refresh every 15 seconds
fetchMTR();
setInterval(fetchMTR, 15000);
</script>

</body>
</html>
